[project]
name = "kitsune-bench-triage"
version = "0.1.0"
description = "kitsuneOS bench capture triage workflow for KRI — model-pinned triage, debug, and A/B reads"
requires-python = ">=3.12"
dependencies = [
    "mistralai>=3.0",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

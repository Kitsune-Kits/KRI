#
#  agents-guard.yml
#  kri — org-wide reusable workflow (GitHub homecoming)
#
#  Abstract:
#      The KRI context-rot guard as a reusable workflow (ADR-0006
#      pattern). Repos call it with
#      uses: Kitsune-Kits/KRI/.github/workflows/agents-guard.yml@main
#      instead of carrying their own copy of the job — the same shape
#      as the GitLab include (.gitlab/templates/agents-guard.yml).
#      The guard reads the kri-link-required input (default true);
#      set it to false only in the KRI hub itself (no self-link).
#      Non-blocking by design — failures are signals, not gates.
#
#  Copyright (c) 2026 Kitsune Research Industries. All rights reserved.

name: agents-guard

on:
  workflow_call:
    inputs:
      kri-link-required:
        description: Set to false only in the KRI hub itself (no self-link).
        type: boolean
        default: true

jobs:
  agents-guard:
    name: agents-guard (context-rot guard, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Grounding files, KRI link, PROJECT-STATUS freshness
        env:
          KRI_LINK_REQUIRED: ${{ inputs.kri-link-required }}
        run: |
          set -u
          FAIL=0
          for f in AGENTS.md CLAUDE.md PROJECT-STATUS.md; do
            if [ -f "$f" ]; then
              echo "OK: $f present"
            else
              echo "FAIL: $f is missing"
              FAIL=1
            fi
          done
          if [ -f CLAUDE.md ] && ! grep -q '@AGENTS.md' CLAUDE.md; then
            echo "FAIL: CLAUDE.md does not import AGENTS.md (@AGENTS.md)"
            FAIL=1
          fi
          if [ "${KRI_LINK_REQUIRED:-true}" = "true" ] && [ -f AGENTS.md ]; then
            if grep -Eq '(kitsune-kits/kri|KitsuneKits/KRI|Kitsune-Kits/KRI)' AGENTS.md; then
              echo "OK: AGENTS.md links to the KRI org repo"
            else
              echo "FAIL: AGENTS.md does not link to the KRI org repo"
              FAIL=1
            fi
          fi
          if [ -f PROJECT-STATUS.md ]; then
            updated=$(grep -m1 -o '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]' PROJECT-STATUS.md || true)
            if [ -z "$updated" ]; then
              echo "WARN: no date found in PROJECT-STATUS.md"
            else
              then=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
              if [ "$then" -gt 0 ]; then
                now=$(date +%s)
                age=$(( (now - then) / 86400 ))
                if [ "$age" -gt 30 ]; then
                  echo "WARN: PROJECT-STATUS.md is ${age} days old (>30) — refresh it"
                else
                  echo "OK: PROJECT-STATUS.md updated ${age} days ago"
                fi
              else
                echo "WARN: could not parse PROJECT-STATUS.md date ($updated)"
              fi
            fi
          fi
          exit $FAIL

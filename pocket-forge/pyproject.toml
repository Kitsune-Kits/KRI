[project]
name = "pocket-forge"
version = "0.1.0"
description = "The KRI ensemble as Managed Agents — four fox spirits with GitHub hands, one front door."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Managed Agents SDK (public preview) — pinned per the quickstart canon.
    "mistralai-agents[koyeb]==1.1.0",
    # GitHub REST access for the forge's typed tools.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

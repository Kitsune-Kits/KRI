#
#  .gitlab-ci.yml
#  kri
#
#  Abstract:
#      Minimal CI for the KRI org context hub: the shared agents-guard
#      template (ADR-0006) and a sibling repo link check. All jobs are
#      non-blocking — signals, not gates (org convention).
#
#  Copyright (c) 2026 Kitsune Research Industries. All rights reserved.

include:
  - local: .gitlab/templates/agents-guard.yml

stages:
  - validate

# -- Agents guard (org template, ADR-0006; kri is the hub, no self-link) --
agents-guard:
  variables:
    KRI_LINK_REQUIRED: "false"

# -- Sibling repo link check (README / ORG-CONTEXT URLs resolve) --
repo-link-check:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for url in \
        https://gitlab.com/kitsune-kits/kitsunebios \
        https://gitlab.com/kitsune-kits/kitsuneOS \
        https://gitlab.com/kitsune-kits/Project-Kogane \
        https://gitlab.com/kitsune-kits/Project-Saffron-Blossom \
        https://gitlab.com/kitsune-kits/Project-Lazy-Comet; do
        code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
        echo "$code $url"
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
